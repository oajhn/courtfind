<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset your password — CourtFinder</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --asphalt: #232527;
    --asphalt-light: #34373a;
    --chalk: #F0EDE6;
    --paint-orange: #D6491F;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--asphalt); color: var(--chalk);
    font-family: 'Inter', sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    width: 100%; max-width: 360px;
    background: var(--asphalt-light);
    border: 1px solid rgba(240,237,230,0.12);
    border-radius: 10px;
    padding: 28px;
  }
  h1 {
    font-family: 'Archivo Black', sans-serif;
    font-size: 22px; margin: 0 0 6px;
    color: var(--paint-orange);
  }
  p { color: #cfcac1; font-size: 13.5px; margin: 0 0 18px; }
  input {
    width: 100%; padding: 10px 12px; margin-bottom: 10px;
    background: var(--asphalt); border: 1px solid rgba(240,237,230,0.15);
    border-radius: 6px; color: var(--chalk); font-family: inherit; font-size: 14px;
  }
  button {
    width: 100%; padding: 10px; margin-top: 4px;
    background: var(--paint-orange); border: none; border-radius: 6px;
    color: var(--chalk); font-weight: 600; font-size: 14px; cursor: pointer; font-family: inherit;
  }
  #status { margin-top: 14px; font-size: 13px; }
  .error { color: #e08a8a; }
  .success { color: #a9d8c5; }
</style>
</head>
<body>
  <div class="card">
    <h1>Reset password</h1>
    <p>Enter a new password for your account.</p>
    <input type="password" id="newPassword" placeholder="New password (min 8 characters)" />
    <input type="password" id="confirmPassword" placeholder="Confirm new password" />
    <button id="submitBtn">Reset password</button>
    <div id="status"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const statusEl = document.getElementById('status');

    if (!token) {
      statusEl.textContent = 'Missing reset token — use the link from your email.';
      statusEl.className = 'error';
      document.getElementById('submitBtn').disabled = true;
    }

    document.getElementById('submitBtn').addEventListener('click', async () => {
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword.length < 8) {
        statusEl.textContent = 'Password must be at least 8 characters.';
        statusEl.className = 'error';
        return;
      }
      if (newPassword !== confirmPassword) {
        statusEl.textContent = "Passwords don't match.";
        statusEl.className = 'error';
        return;
      }

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Reset failed');
        statusEl.textContent = 'Password reset! You can now log in with your new password.';
        statusEl.className = 'success';
        document.getElementById('submitBtn').disabled = true;
      } catch (err) {
        statusEl.textContent = err.message;
        statusEl.className = 'error';
      }
    });
  </script>
</body>
</html>
